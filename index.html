<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoGuide – Safe Path Audio Navigation</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #00e5ff;
      --green: #10b981;
      --red: #f43f5e;
      --text: #f1f5f9;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
    }

    p.sub {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    /* Directional Path Visualizer */
    .gauge-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pan-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      position: relative;
      margin-top: 20px;
    }

    .pan-indicator {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent);
      transition: left 0.25s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .pan-labels {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 14px;
      font-weight: 600;
    }

    .direction-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
    }

    /* Music Player Controls */
    .audio-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-ble {
      background: var(--accent);
      color: #03101e;
    }

    .btn-music {
      background: #334155;
      color: var(--text);
    }

    .btn-music.active {
      background: var(--green);
      color: #03101e;
    }

    .custom-file {
      display: none;
    }

    .file-btn {
      text-align: center;
      font-size: 0.85rem;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }

    .ear-status {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>EchoGuide</h1>
    <p class="sub">Safe Corridor Audio Steering</p>
  </header>

  <div class="container">
    <!-- Visual Corridor Display -->
    <div class="card">
      <div class="direction-title" id="dirText">Centered</div>
      <p style="text-align:center; font-size: 0.85rem; color: var(--text-dim);" id="panReadout">Pan: 0</p>

      <div class="gauge-wrapper">
        <div class="pan-track">
          <div id="panPin" class="pan-indicator">●</div>
        </div>
        <div class="pan-labels">
          <span>LEFT (-100)</span>
          <span>CENTER (0)</span>
          <span>RIGHT (+100)</span>
        </div>
      </div>

      <div class="ear-status">
        <span>Left Ear: <b id="leftEarVol">100%</b></span>
        <span>Right Ear: <b id="rightEarVol">100%</b></span>
      </div>
    </div>

    <!-- Music & Audio Engine -->
    <div class="card audio-controls">
      <button id="btnPlayMusic" class="btn btn-music" onclick="toggleMusicPlayback()">
        ▶ Play Navigation Track
      </button>

      <label class="file-btn">
        Or select a custom song from your device (.mp3)
        <input type="file" id="audioFileInput" class="custom-file" accept="audio/*">
      </label>
    </div>

    <!-- BLE Connection Card -->
    <div class="card">
      <button id="btnConnect" class="btn btn-ble" onclick="connectBLE()">
        Connect ESP32-Pan
      </button>
      <p id="bleStatus" style="text-align:center; font-size:0.85rem; color:var(--text-dim); margin-top:10px;">
        Not Connected
      </p>
    </div>
  </div>

  <script>
    // --- UUIDs from your friend's code ---
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let bleTxChar = null;

    // --- Web Audio Equalization / Panning Pipeline ---
    let audioCtx = null;
    let stereoPanner = null;
    let audioElement = null;
    let isPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        stereoPanner = audioCtx.createStereoPanner();

        // Default royalty-free ambient audio stream for immediate testing
        audioElement = new Audio("https://actions.google.com/sounds/v1/water/rain_heavy.ogg");
        audioElement.loop = true;
        audioElement.crossOrigin = "anonymous";

        const source = audioCtx.createMediaElementSource(audioElement);
        source.connect(stereoPanner);
        stereoPanner.connect(audioCtx.destination);

        // Listener for local user MP3 upload
        document.getElementById("audioFileInput").addEventListener("change", function(e) {
          const file = e.target.files[0];
          if (file) {
            audioElement.src = URL.createObjectURL(file);
            if (isPlaying) audioElement.play();
          }
        });
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleMusicPlayback() {
      initAudio();
      const btn = document.getElementById("btnPlayMusic");

      if (!isPlaying) {
        audioElement.play().then(() => {
          isPlaying = true;
          btn.innerText = "⏸ Pause Navigation Track";
          btn.classList.add("active");
        }).catch(err => {
          alert("Audio error: " + err.message);
        });
      } else {
        audioElement.pause();
        isPlaying = false;
        btn.innerText = "▶ Play Navigation Track";
        btn.classList.remove("active");
      }
    }

    // --- Bluetooth BLE Handling ---
    async function connectBLE() {
      initAudio();

      try {
        document.getElementById("bleStatus").innerText = "Pairing with ESP32-Pan...";
        
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32-Pan" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          document.getElementById("bleStatus").innerText = "Disconnected";
          document.getElementById("btnConnect").style.display = "block";
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleTxChar = await service.getCharacteristic(TX_UUID);

        await bleTxChar.startNotifications();
        bleTxChar.addEventListener('characteristicvaluechanged', handlePanNotification);

        document.getElementById("bleStatus").innerText = "Connected to ESP32-Pan";
        document.getElementById("btnConnect").innerText = "Connected";
      } catch (err) {
        console.error(err);
        document.getElementById("bleStatus").innerText = "Connection Failed: " + err.message;
      }
    }

    // --- Process incoming Pan value (-100 to +100) ---
    function handlePanNotification(event) {
      const decoder = new TextDecoder('utf-8');
      const valStr = decoder.decode(event.target.value).trim();
      const panVal = parseInt(valStr, 10);

      if (!isNaN(panVal)) {
        updatePanState(panVal);
      }
    }

    function updatePanState(pan) {
      const clamped = Math.max(-100, Math.min(100, pan));
      document.getElementById("panReadout").innerText = `Pan: ${clamped}`;

      // 1. Move UI visual indicator (from 0% to 100% position on the track)
      const percentPos = ((clamped + 100) / 200) * 100;
      document.getElementById("panPin").style.left = `${percentPos}%`;

      // 2. Update direction text guidance
      const dirElem = document.getElementById("dirText");
      if (clamped <= -30) {
        dirElem.innerText = `Walk Left (${Math.abs(clamped)}%)`;
        dirElem.style.color = "#38bdf8";
      } else if (clamped >= 30) {
        dirElem.innerText = `Walk Right (${clamped}%)`;
        dirElem.style.color = "#38bdf8";
      } else {
        dirElem.innerText = "Path Ahead Clear";
        dirElem.style.color = "var(--green)";
      }

      // 3. Modulate Stereo Equalization / Balance
      // Web Audio stereoPanner pan ranges from -1.0 (Left) to +1.0 (Right)
      if (stereoPanner) {
        const audioPanFactor = clamped / 100.0;
        stereoPanner.pan.setValueAtTime(audioPanFactor, audioCtx.currentTime);
      }

      // 4. Update Earphone Volume Status Readout
      const leftPerc = clamped <= 0 ? 100 : Math.round((1 - clamped / 100) * 100);
      const rightPerc = clamped >= 0 ? 100 : Math.round((1 - Math.abs(clamped) / 100) * 100);
      document.getElementById("leftEarVol").innerText = `${leftPerc}%`;
      document.getElementById("rightEarVol").innerText = `${rightPerc}%`;
    }
  </script>
</body>
</html>
