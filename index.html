<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoGuide – Spatial Navigation</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #00e5ff;
      --green: #10b981;
      --alert: #ff3366;
      --text: #f1f5f9;
      --text-dim: #7e8c9f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
    }

    p.sub {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* Radar Canvas */
    .radar-wrapper {
      position: relative;
      width: 100%;
      padding-top: 55%;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 90%, #1a233a 0%, #0d121d 100%);
    }

    /* Steering Corridor Gauge */
    .corridor-header {
      text-align: center;
      margin-top: 8px;
    }

    .corridor-label {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }

    .gauge-track {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      position: relative;
      margin: 14px 0 6px 0;
    }

    .gauge-pointer {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px var(--accent);
      transition: left 0.1s ease-out;
    }

    .gauge-markers {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .ear-readouts {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
    }

    /* Controls */
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-ble {
      background: var(--accent);
      color: #03101e;
    }

    .btn-music {
      background: #1e293b;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 8px;
    }

    .btn-music.active {
      background: var(--green);
      color: #03101e;
      border: none;
    }

    .file-input-wrapper {
      margin-top: 8px;
      text-align: center;
    }

    .file-btn {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    #fileInput {
      display: none;
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .dot.active {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
  </style>
</head>
<body>

  <header>
    <h1>EchoGuide</h1>
    <p class="sub">Spatial Navigation & Corridor Steering</p>
  </header>

  <div class="container">
    <!-- Visual Radar & Corridor Gauge -->
    <div class="card">
      <div class="radar-wrapper">
        <canvas id="radarCanvas"></canvas>
      </div>

      <div class="corridor-header">
        <div class="corridor-label" id="dirText">Path Ahead Clear</div>
        <div style="font-size: 0.8rem; color: var(--text-dim); margin-top: 2px;">
          Pan Index: <span id="panVal">0</span>
        </div>
      </div>

      <div class="gauge-track">
        <div class="gauge-pointer" id="pointer"></div>
      </div>
      <div class="gauge-markers">
        <span>LEFT (-100)</span>
        <span>AHEAD (0)</span>
        <span>RIGHT (+100)</span>
      </div>

      <div class="ear-readouts">
        <span>Left Ear: <b id="leftVol">100%</b></span>
        <span>Right Ear: <b id="rightVol">100%</b></span>
      </div>
    </div>

    <!-- Audio Player Controls -->
    <div class="card">
      <audio id="audioElement" loop crossorigin="anonymous"></audio>

      <button id="btnPlayMusic" class="btn btn-music" onclick="toggleAudio()">
        ▶ Play Navigation Track
      </button>

      <div class="file-input-wrapper">
        <label class="file-btn">
          Select custom MP3 song
          <input type="file" id="fileInput" accept="audio/*">
        </label>
      </div>
    </div>

    <!-- Bluetooth Connection Card -->
    <div class="card">
      <button id="btnConnect" class="btn btn-ble" onclick="connectBLE()">
        Connect ESP32-Pan
      </button>

      <div class="status-badge">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RADAR_UUID   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const PAN_TX_UUID  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let ctx = null;
    let panner = null;
    const audio = document.getElementById('audioElement');
    let isPlaying = false;

    // Default ambient test audio
    audio.src = "https://actions.google.com/sounds/v1/weather/light_rain.ogg";

    function initAudio() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        panner = new StereoPannerNode(ctx, { pan: 0 });
        const source = ctx.createMediaElementSource(audio);
        source.connect(panner);
        panner.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        if (isPlaying) audio.play();
      }
    });

    function toggleAudio() {
      initAudio();
      const btn = document.getElementById('btnPlayMusic');

      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          btn.innerText = "⏸ Pause Navigation Track";
          btn.classList.add("active");
        }).catch(err => alert("Audio playback error: " + err.message));
      } else {
        audio.pause();
        isPlaying = false;
        btn.innerText = "▶ Play Navigation Track";
        btn.classList.remove("active");
      }
    }

    // --- Web Bluetooth Connection ---
    async function connectBLE() {
      initAudio();

      try {
        updateStatus("Scanning for ESP32-Pan...", false);

        // Compatible with both service filtering and explicit name matching
        const dev = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        dev.addEventListener('gattserverdisconnected', onDisconnected);

        updateStatus("Connecting GATT...", false);
        const srv = await dev.gatt.connect();
        const primaryService = await srv.getPrimaryService(SERVICE_UUID);

        // Subscribe to Channel 1 (Pan)
        const chPan = await primaryService.getCharacteristic(PAN_TX_UUID);
        await chPan.startNotifications();
        chPan.addEventListener('characteristicvaluechanged', (e) => {
          const v = parseInt(new TextDecoder().decode(e.target.value), 10);
          if (!isNaN(v)) updateSteering(v);
        });

        // Subscribe to Channel 2 (Radar Telemetry)
        try {
          const chRadar = await primaryService.getCharacteristic(RADAR_UUID);
          await chRadar.startNotifications();
          chRadar.addEventListener('characteristicvaluechanged', (e) => {
            const raw = new TextDecoder().decode(e.target.value).trim();
            if (raw.startsWith("$")) {
              const parts = raw.substring(1).split(",");
              if (parts.length === 2) {
                const angle = parseInt(parts[0], 10);
                const dist = parseInt(parts[1], 10);
                if (!isNaN(angle) && !isNaN(dist)) processRadarPoint(angle, dist);
              }
            }
          });
        } catch (radarErr) {
          console.warn("Radar characteristic not active; using audio mode only.");
        }

        updateStatus("Connected to ESP32-Pan", true);
        document.getElementById('btnConnect').innerText = "Connected";
      } catch (err) {
        console.error("BLE Error:", err);
        updateStatus("Connection failed", false);
        alert("Bluetooth connection failed: " + err.message);
      }
    }

    function updateSteering(val) {
      const panClamped = Math.max(-100, Math.min(100, val));
      const normalizedPan = panClamped / 100.0;

      // Equal-power / target pan smoothing
      if (panner && ctx) {
        panner.pan.setTargetAtTime(normalizedPan, ctx.currentTime, 0.1);
      }

      document.getElementById('panVal').textContent = panClamped;

      // Update visual gauge pointer
      const pointerPercent = ((panClamped + 100) / 200) * 100;
      document.getElementById('pointer').style.left = `${pointerPercent}%`;

      // Text guidance
      const dirText = document.getElementById('dirText');
      if (panClamped <= -20) {
        dirText.innerText = `Steer Left (${Math.abs(panClamped)}%)`;
        dirText.style.color = "#38bdf8";
      } else if (panClamped >= 20) {
        dirText.innerText = `Steer Right (${panClamped}%)`;
        dirText.style.color = "#38bdf8";
      } else {
        dirText.innerText = "Path Ahead Clear";
        dirText.style.color = "var(--green)";
      }

      // Volume percentages
      const leftPerc = panClamped <= 0 ? 100 : Math.round((1 - normalizedPan) * 100);
      const rightPerc = panClamped >= 0 ? 100 : Math.round((1 - Math.abs(normalizedPan)) * 100);
      document.getElementById('leftVol').innerText = `${leftPerc}%`;
      document.getElementById('rightVol').innerText = `${rightPerc}%`;
    }

    function onDisconnected() {
      updateStatus("Disconnected", false);
      document.getElementById('btnConnect').innerText = "Connect ESP32-Pan";
      updateSteering(0);
    }

    function updateStatus(text, isActive) {
      document.getElementById("statusText").innerText = text;
      const dot = document.getElementById("statusDot");
      if (isActive) dot.classList.add("active");
      else dot.classList.remove("active");
    }

    // --- Radar Visualizer Canvas ---
    const canvas = document.getElementById("radarCanvas");
    const rCtx = canvas.getContext("2d");
    let currentAngle = 50;
    let blips = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function processRadarPoint(angle, dist) {
      currentAngle = angle;
      if (dist < 200) {
        blips.push({ angle, dist, time: Date.now() });
      }
    }

    function drawRadar() {
      rCtx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.92;
      const radius = Math.min(canvas.width * 0.46, canvas.height * 0.85);

      // Arc rings
      rCtx.strokeStyle = "rgba(0, 229, 255, 0.15)";
      [0.33, 0.66, 1.0].forEach(r => {
        rCtx.beginPath();
        rCtx.arc(cx, cy, radius * r, Math.PI, 2 * Math.PI);
        rCtx.stroke();
      });

      // Rays
      [0, 25, 50, 75, 100].forEach(deg => {
        const rad = Math.PI + (deg / 100.0) * Math.PI;
        rCtx.beginPath();
        rCtx.moveTo(cx, cy);
        rCtx.lineTo(cx + radius * Math.cos(rad), cy + radius * Math.sin(rad));
        rCtx.stroke();
      });

      // Obstacle blips
      const now = Date.now();
      blips = blips.filter(b => now - b.time < 1200);
      blips.forEach(b => {
        const opacity = (1 - (now - b.time) / 1200).toFixed(2);
        const rad = Math.PI + (b.angle / 100.0) * Math.PI;
        const distRatio = Math.min(b.dist / 200.0, 1.0);
        const r = distRatio * radius;

        rCtx.fillStyle = `rgba(255, 51, 102, ${opacity})`;
        rCtx.beginPath();
        rCtx.arc(cx + r * Math.cos(rad), cy + r * Math.sin(rad), 4, 0, 2 * Math.PI);
        rCtx.fill();
      });

      // Sweep needle
      const sweepRad = Math.PI + (currentAngle / 100.0) * Math.PI;
      rCtx.strokeStyle = "#00e5ff";
      rCtx.lineWidth = 2;
      rCtx.beginPath();
      rCtx.moveTo(cx, cy);
      rCtx.lineTo(cx + radius * Math.cos(sweepRad), cy + radius * Math.sin(sweepRad));
      rCtx.stroke();

      requestAnimationFrame(drawRadar);
    }
    drawRadar();
  </script>
</body>
</html>
